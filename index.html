<!-- ===== 内嵌：跨设备同步用的服务端源码（不联网、不执行，只是存着给用户下载）===== -->
<script type="text/plain" id="srvJs">/* 桂信科食堂指南 · 数据同步服务（零依赖，Node 18+ 直接跑）
   —— 窗口端改的开门/售罄/叫号、学生记的饮食，都经过这里同步到每个人

   启动： node server.js                 （默认 3000 端口，需要先装 Node.js）
          PORT=8080 node server.js

   接口只有一个：
     GET  /sync   取全量数据  → {v, ts, week, windows:{}, sold:{}, soldLast:{}, users:{}}
     POST /sync   上传本机数据 → 服务端和上传的数据合并后返回全量
     GET  /health 看活着没

   数据存在同目录的 hub.json，重启不丢；跨周时自动把本周销量归档成上周。

   常见坑：
     1）网页是 https 打开的话，接口也必须 https，否则浏览器会拦；本地测试用 http 没问题
     2）手机访问要用电脑在局域网里的 IP，不是 localhost；Windows 上 ipconfig 里查 IPv4 地址
     3）连不上多半是防火墙，放行 Node.js 即可
*/
const http = require('http');
const fs = require('fs');
const path = require('path');

const PORT = process.env.PORT || 3000;
const FILE = path.join(__dirname, 'hub.json');
const weekId = () => { const t = new Date(); t.setDate(t.getDate() + 4 - (t.getDay() || 7)); return t.toLocaleDateString('sv'); };

let HUB = load();
function load(){
  try{
    const j = JSON.parse(fs.readFileSync(FILE, 'utf8'));
    if(j && j.v) return roll(j);
  }catch(e){}
  return {v:1, ts:0, week:weekId(), windows:{}, sold:{}, soldLast:{}, users:{}};
}
function roll(h){
  const w = weekId();
  if(h.week !== w){ h.soldLast = h.sold || {}; h.sold = {}; h.week = w; }
  if(!h.windows) h.windows = {};
  if(!h.sold) h.sold = {};
  if(!h.soldLast) h.soldLast = {};
  if(!h.users) h.users = {};
  return h;
}
function save(){ try{ fs.writeFileSync(FILE, JSON.stringify(HUB)); }catch(e){} }
const cnt = u => Object.keys((u && u.days) || {}).reduce((s, k) => s + (u.days[k] || []).length, 0);
function mergeDB(a, b){
  const base = (b.ts || 0) > (a.ts || 0) ? b : a;
  const other = base === b ? a : b;
  const out = {
    v:1, ts: Date.now(), week: base.week || weekId(),
    windows: JSON.parse(JSON.stringify(base.windows || {})),
    sold: {}, soldLast: {},
    users: JSON.parse(JSON.stringify(base.users || {}))
  };
  Object.keys(other.windows || {}).forEach(id => { if(!out.windows[id]) out.windows[id] = other.windows[id]; });
  const keys = k => [...new Set([...Object.keys(base[k] || {}), ...Object.keys(other[k] || {})])];
  keys('sold').forEach(x => { out.sold[x] = Math.max((base.sold || {})[x] || 0, (other.sold || {})[x] || 0); });
  keys('soldLast').forEach(x => { out.soldLast[x] = Math.max((base.soldLast || {})[x] || 0, (other.soldLast || {})[x] || 0); });
  Object.keys(other.users || {}).forEach(sid => { if(cnt(other.users[sid]) > cnt(out.users[sid])) out.users[sid] = other.users[sid]; });
  return out;
}

const send = (res, code, obj) => {
  res.writeHead(code, {
    'Content-Type': 'application/json; charset=utf-8',
    'Access-Control-Allow-Origin': '*',
    'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
    'Access-Control-Allow-Headers': 'Content-Type'
  });
  res.end(JSON.stringify(obj));
};
const readBody = req => new Promise(r => {
  let s = '';
  req.on('data', c => { s += c; if(s.length > 5e6) req.destroy(); });
  req.on('end', () => r(s));
});

http.createServer(async (req, res) => {
  const url = new URL(req.url, 'http://x');
  if(req.method === 'OPTIONS') return send(res, 204, {});

  if(url.pathname === '/health') return send(res, 200, {
    ok: true, week: HUB.week, windows: Object.keys(HUB.windows).length,
    students: Object.keys(HUB.users).length
  });

  if(url.pathname === '/sync' && req.method === 'GET'){
    HUB = roll(HUB);
    return send(res, 200, HUB);
  }

  if(url.pathname === '/sync' && req.method === 'POST'){
    let d = null;
    try{ d = JSON.parse(await readBody(req)); }catch(e){ return send(res, 400, {error:'body 不是合法 JSON'}); }
    if(!d || !d.v) return send(res, 400, {error:'缺少 v 字段'});
    HUB = roll(mergeDB(HUB, d));
    save();
    return send(res, 200, HUB);
  }
  send(res, 404, {error:'只有 GET/POST /sync'});
}).listen(PORT, () => console.log('食堂数据同步服务已启动： http://localhost:' + PORT + '/sync'));
</script>

<script type="text/plain" id="cloudJs">/* 桂信科食堂指南 · 微信云开发 / 腾讯云 CloudBase 版云函数（函数名 sync）
   想让全校同学用手机也能同步，又不想自己开电脑，就用这个：

   1）CloudBase 建环境，建集合 hub（权限：所有用户可读可写）
   2）新建云函数 sync，把本文件贴进去，依赖里加 @cloudbase/node-sdk
   3）HTTP 访问服务路径填 /sync，拿到 https://xxx.service.tcloudbase.com/sync
   4）把这个地址填到食堂指南「我的」页的服务器地址里

   免费版额度（CloudBase 免费体验版 / 微信云开发基础套餐）：云函数 20 万次/月、
   数据库读 5 万次/天，一个食堂的窗口数量完全够用。
*/
const cloudbase = require('@cloudbase/node-sdk');
const app = cloudbase.init({env: process.env.ENV_ID || cloudbase.SYMBOL_CURRENT_ENV});
const db = app.database();
const COL = 'hub';
const DOC = 'main';
const weekId = () => { const t = new Date(); t.setDate(t.getDate() + 4 - (t.getDay() || 7)); return t.toLocaleDateString('sv'); };
const cnt = u => Object.keys((u && u.days) || {}).reduce((s, k) => s + (u.days[k] || []).length, 0);

function roll(h){
  const w = weekId();
  if(h.week !== w){ h.soldLast = h.sold || {}; h.sold = {}; h.week = w; }
  if(!h.windows) h.windows = {};
  if(!h.sold) h.sold = {};
  if(!h.soldLast) h.soldLast = {};
  if(!h.users) h.users = {};
  return h;
}
function mergeDB(a, b){
  const base = (b.ts || 0) > (a.ts || 0) ? b : a;
  const other = base === b ? a : b;
  const out = {v:1, ts: Date.now(), week: base.week || weekId(),
    windows: Object.assign({}, base.windows || {}), sold: {}, soldLast: {}, users: Object.assign({}, base.users || {})};
  Object.keys(other.windows || {}).forEach(id => { if(!out.windows[id]) out.windows[id] = other.windows[id]; });
  const keys = k => [...new Set([...Object.keys(base[k] || {}), ...Object.keys(other[k] || {})])];
  keys('sold').forEach(x => { out.sold[x] = Math.max((base.sold || {})[x] || 0, (other.sold || {})[x] || 0); });
  keys('soldLast').forEach(x => { out.soldLast[x] = Math.max((base.soldLast || {})[x] || 0, (other.soldLast || {})[x] || 0); });
  Object.keys(other.users || {}).forEach(sid => { if(cnt(other.users[sid]) > cnt(out.users[sid])) out.users[sid] = other.users[sid]; });
  return out;
}

async function read(){
  try{
    const r = await db.collection(COL).doc(DOC).get();
    if(r && r.data && r.data[0]) return roll(r.data[0]);
  }catch(e){}
  return {v:1, ts:0, week:weekId(), windows:{}, sold:{}, soldLast:{}, users:{}};
}
async function write(h){
  try{ await db.collection(COL).doc(DOC).set(h); }
  catch(e){ try{ await db.collection(COL).add(Object.assign({_id: DOC}, h)); }catch(e2){} }
}

exports.main = async (event) => {
  const method = (event.httpMethod || (event.body ? 'POST' : 'GET')).toUpperCase();
  let body = {};
  if(event.body){ try{ body = typeof event.body === 'string' ? JSON.parse(event.body) : event.body; }catch(e){} }
  const out = (code, obj) => ({
    statusCode: code,
    headers: {'Content-Type':'application/json; charset=utf-8', 'Access-Control-Allow-Origin':'*',
              'Access-Control-Allow-Methods':'GET,POST,OPTIONS', 'Access-Control-Allow-Headers':'Content-Type'},
    body: JSON.stringify(obj)
  });
  if(method === 'OPTIONS') return out(204, {});
  if(method === 'GET') return out(200, roll(await read()));
  if(method === 'POST'){
    if(!body.v) return out(400, {error:'缺少 v 字段'});
    const h = roll(mergeDB(await read(), body));
    await write(h);
    return out(200, h);
  }
  return out(405, {error:'只支持 GET / POST'});
};

  { v, ts, week,

    users:{ 学号: {name, days:{ '2026-10-27': [{w:窗口id, d:菜品id, n:菜名, price, kcal, p, c, f, meal, qty}] }} } }

const DBK = 'gx_hub';

function weekId(){
  const t = new Date();
  t.setDate(t.getDate() + 4 - (t.getDay() || 7));
  return t.toLocaleDateString('sv');
}
function hash(s){ let h = 2166136261; for(let i = 0; i < String(s).length; i++){ h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }

/* ---- 同一浏览器里，别的标签页改了数据这边立刻跟上（开两个标签页就能演示）---- */

function seedDB(){
  const s = {};

  return {v:1, ts:Date.now(), week:weekId(), windows:{}, sold:{}, soldLast:s, users:{}};
}
function loadDB(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(DBK) || 'null'); }catch(e){}
  if(!d || !d.v) d = seedDB();
  if(d.week !== weekId()){ d.soldLast = d.sold || {}; d.sold = {}; d.week = weekId(); }
  if(!d.windows) d.windows = {};
  if(!d.sold) d.sold = {};
  if(!d.soldLast) d.soldLast = {};
  if(!d.users) d.users = {};
  return d;
}
function saveDB(){
  DB.ts = Date.now();
  try{
    localStorage.setItem(DBK, JSON.stringify(DB));
    localStorage.setItem(DBK + '_ts', String(DB.ts));   // 单独存一份时间戳，轮询时只看这一小串，省事
  }catch(e){}
  LAST_TS = DB.ts;

/* ---- 可选的跨设备同步 ---- */
const API = {base: store('apiBase') || '', err:''};
const countRec = u => Object.keys((u && u.days) || {}).reduce((s, k) => s + (u.days[k] || []).length, 0);
function apiPush(){
  if(!API.base) return;
  try{ fetch(API.base + '/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(DB)}).catch(() => {}); }catch(e){}
}
async function apiPull(){
  if(!API.base) return;
  try{
    const r = await fetch(API.base + '/sync?t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if(j && j.v){ mergeDB(j); API.err = ''; }
  }catch(e){ API.err = '连不上服务器，现在用的是本机数据'; }
}
function mergeDB(j){
  const mine = DB;
  if((j.ts || 0) > (mine.ts || 0)){
    DB = j;
    Object.keys(mine.users || {}).forEach(sid => {
      if(!DB.users[sid] || countRec(mine.users[sid]) > countRec(DB.users[sid])) DB.users[sid] = mine.users[sid];
    });
  }else{
    Object.keys(j.users || {}).forEach(sid => {
      if(!mine.users[sid] || countRec(j.users[sid]) > countRec(mine.users[sid])) mine.users[sid] = j.users[sid];
    });
  }
  DB = loadDB2(DB);
}
function loadDB2(d){
  if(d.week !== weekId()){ d.soldLast = d.sold || {}; d.sold = {}; d.week = weekId(); }
  if(!d.windows) d.windows = {}; if(!d.sold) d.sold = {}; if(!d.soldLast) d.soldLast = {}; if(!d.users) d.users = {};

}

/* ============ 时间、人流与排队的模拟 ============ */
function nowMin(){ if(S.sim != null) return S.sim; const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function flow(m){
  const g = (c, s, a) => a * Math.exp(-((m - c) ** 2) / (2 * s * s));
  return Math.min(1, g(465, 28, .55) + g(725, 30, 1) + g(1075, 32, .82) + .04);
}
// 窗口端可以强制设为开门或关门；没设过就按营业时段自动判断
const isOpen = (w, m) => {
  const r = DB.windows[w.id];
  if(r && r.open === false) return false;
  if(r && r.open === true) return true;
  return !w.rest && HR[w.hours].some(h => m >= h[0] && m < h[1]);
};
const anyOpen = m => WINS.some(w => isOpen(w, m));
const target = (w, m) => isOpen(w, m) ? Math.max(0, Math.round(flow(m) * w.pop * FLOOR_BUSY[w.floor] * 18)) : 0;
const lvOf = q => q <= 0 ? 0 : q <= 4 ? 1 : q <= 9 ? 2 : q <= 15 ? 3 : 4;
const LVN = ['空闲','较少','适中','较多','拥挤'];
const ST = {};
function initState(keep){
  const m = nowMin();
  WINS.forEach((w, i) => {
    const sv = keep && ST[w.id] ? ST[w.id].serving : 30 + (i * 53) % 60;
    ST[w.id] = {serving:sv, issued:sv + target(w, m), jit:0};
  });
}
/* ---- 窗口端上报的叫号，取出来并按出餐速度往前推一点 ---- */
function winState(w){
  const r = DB.windows[w.id];
  if(!r || !r.at || !(r.serving || r.issued)) return null;
  const age = Date.now() - r.at;
  if(age > STALE) return null;                        // 太久没动，别拿老数据骗人
  const d = Math.floor(age / 1000 / Math.max(20, w.avg));
  return {serving:r.serving + d, issued:Math.max(r.serving + d, r.issued + d), src:'win', at:r.at, age};
}
function effState(w){
  const r = winState(w);
  if(r) return r;
  const s = ST[w.id] || {serving:0, issued:0};
  return {serving:s.serving, issued:s.issued, src:'demo', at:0, age:0};
}
const srcText = s => s.src === 'win' ? '窗口实时' : '模拟';
const ageText = s => { const m = Math.floor((s.age || 0) / 60000); return m < 1 ? '刚刚' : m + ' 分钟前'; };
function qOf(w){
  if(!isOpen(w, nowMin())) return 0;
  const s = effState(w);
  return Math.max(0, s.issued - s.serving);
}
function liveCount(){
  let a = 0;
  WINS.forEach(w => { if(effState(w).src === 'win') a++; });
  return {live:a};
}
const fmtDur = sec => { const m = Math.max(1, Math.ceil(sec / 60)); return m + ' 分钟'; };
function tick(){
  const m = nowMin();
  WINS.forEach(w => {
    const s = ST[w.id];
    const L = winState(w);
    if(L){ s.serving = L.serving; s.issued = L.issued; return; }   // 有窗口端数据就跟着它走
    if(!isOpen(w, m)){ s.issued = s.serving; return; }
    if(Math.random() < .4) s.jit = Math.max(-2, Math.min(2, s.jit + (Math.random() < .5 ? -1 : 1)));
    const d = Math.max(0, target(w, m) + s.jit) - (s.issued - s.serving);
    if(d > 0) s.issued += 1 + (d > 6 ? 1 : 0);
    else if(d < 0) s.serving = Math.min(s.issued, s.serving + 1 + (d < -6 ? 1 : 0));
    else if(Math.random() < .5){ s.serving++; s.issued++; }
  });
  paintDynamic();
}

/* ============ 首页：人流预测与错峰建议 ============ */
function flowHTML(){
  const m = nowMin(), f = flow(m), open = anyOpen(m);
  let bars = '';
  for(let t = 390; t < 1230; t += 30){
    const mid = t + 15, ov = anyOpen(mid), v = flow(mid);
    const lv = ov ? Math.min(4, Math.floor(v * 4.99)) : 0;
    bars += `<i class="${m >= t && m < t + 30 ? 'now' : ''}" style="height:${ov ? Math.max(10, Math.round(v * 100)) : 6}%;background:${ov ? 'var(--h' + lv + ')' : 'var(--closed)'}" title="${hm(t)}～${hm(t + 30)} ${ov ? LVN[lv] : '休息'}"></i>`;
  }
  const labs = [[420,'7:00'],[540,'9:00'],[720,'12:00'],[900,'15:00'],[1080,'18:00'],[1200,'20:00']]
    .map(a => `<span style="position:absolute;left:${((a[0] - 390) / 840 * 100).toFixed(1)}%;transform:translateX(-50%)">${a[1]}</span>`).join('');
  const lv = open ? Math.min(4, Math.floor(f * 4.99)) : 0;
  let nextOpen = null;
  for(let t = m + 5; t < m + 1440; t += 5){ if(anyOpen(t % 1440)){ nextOpen = t % 1440; break; } }
  let head, items = [];
  if(!open){
    head = '食堂现在休息' + (nextOpen != null ? '，' + hm(nextOpen) + ' 开门' : '');
    if(nextOpen != null) items.push('开门后的前 20 分钟最空，想少排队可以卡这个点');
  }else{
    head = f >= .5 ? '现在是高峰，排队的人多' : f >= .28 ? '人流适中，稍微排一下' : '现在人少，可以直接去';
    if(f >= .28){
      let low = null;
      for(let t = m + 5; t < m + 240 && t < 1260; t += 5){ if(anyOpen(t) && flow(t) < .28){ low = t; break; } }
      items.push(low != null ? `错峰建议：${hm(low)} 以后再去，人流会明显减少` : '这一波高峰还要持续一阵，可以先去人少的楼层');
    }
    const real = WINS.filter(w => !w.sample && isOpen(w, m));
    const fl = [1,2,3].map(n => {
      const a = real.filter(w => w.floor === n);
      return {n, avg:a.length ? a.reduce((s, w) => s + qOf(w), 0) / a.length : 99};
    }).sort((a, b) => a.avg - b.avg);
    if(fl[0].avg < 99) items.push(`${fl[0].n} 楼现在最空，平均每个窗口排 ${fl[0].avg.toFixed(1)} 人`);
    const top = real.slice().sort((a, b) => qOf(a) - qOf(b)).slice(0, 3);
    if(top.length) items.push('最空的窗口：' + top.map(w => `${w.floor}楼${esc(w.name)}（${qOf(w)}人）`).join('、'));
  }
  const sims = [[null,'现在（实时）'], [460,'07:40'], [725,'12:05'], [1075,'17:55'], [900,'15:00 休息']]
    .map(a => `<button type="button" class="chip" data-sim="${a[0]}" aria-pressed="${S.sim === a[0]}">${a[1]}</button>`).join('');
  const lc = liveCount(), srcHint = lc.live ? `实时 ${lc.live} 窗 · 报号 ${lc.report} 窗` : lc.report ? `现场报号 ${lc.report} 窗 · 其余模拟` : '模拟数据 · 每几秒自动刷新';
  return `<h2>人流预测与错峰建议 <span class="hint">${srcHint}</span></h2>
    <div class="reco"><div class="big"><span class="lv" style="background:var(--h${lv});color:var(--h${lv}i)">${open ? LVN[lv] : '休息'}</span>${head}</div>
    ${items.length ? '<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>' : ''}</div>
    <div class="flow" role="img" aria-label="全天人流柱状图">${bars}</div>
    <div class="flow-lab" style="position:relative;height:18px;display:block">${labs}</div>
    <div class="note" style="margin-top:6px">柱子越深人越多，黑框是当前时段。一天有三个高峰：早饭、午饭、晚饭。</div>
    <div class="sim"><span class="hint">演示时间</span>${sims}</div>`;
}

let RAND = null;
function pickRandom(){
  const pool = DISHES.filter(d => {
    const w = winById(d.win);
    if(!isOpen(w, nowMin())) return false;
    if(dishOut(w, d)) return false;
    if(S.diet.halal && !d.halal) return false;
    if(S.diet.veg && !d.veg) return false;
    if(S.diet.avoid.some(a => d.has.includes(a))) return false;
    return true;
  });
  if(!pool.length) return null;
  const pick = arr => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
  const mains = pool.filter(d => d.role === 'M'), sides = pool.filter(d => d.role === 'S');
  const main = pick(mains.length ? mains : pool);
  const side = pick(sides.filter(s => s.win === main.win || sides.length < 4));
  return {main, side};
}
function randHTML(){
  if(!RAND) RAND = pickRandom();
  const r = RAND;
  if(!r || !r.main) return '<div class="note">现在没有能推荐的菜：可能窗口都关了，或者被你设的忌口条件筛没了。</div>';
  const m = r.main, w = winById(m.win);
  let h = `<button type="button" class="resbtn" data-win="${m.win}">${dishRow(m, true)}</button>`;
  if(r.side) h += `<button type="button" class="resbtn" data-win="${r.side.win}">${dishRow(r.side, true)}</button>`;
  const kcal = m.kcal + (r.side ? r.side.kcal : 0), pr = m.price + (r.side ? r.side.price : 0);
  const p = m.p + (r.side ? r.side.p : 0);
  h += `<p class="note" style="margin-top:8px">这一份 ${kcal} 千卡、蛋白质 ${p}g、¥${pr.toFixed(1)}。${w.floor} 楼${esc(w.name)}，现在排 ${qOf(w)} 人，约 ${fmtDur((qOf(w) + 1) * w.avg)} 能取到。</p>`;
  return h;
}
function topHTML(){
  const list = DISHES.slice().sort((a, b) => (DB.soldLast[b.id] || 0) - (DB.soldLast[a.id] || 0)).slice(0, 10);
  const max = Math.max(1, ...list.map(d => DB.soldLast[d.id] || 0));
  return list.map((d, i) => {

      <b>${i + 1}. ${esc(d.name)}</b><span class="num">${n} 份 · ¥${d.price}</span></div>

      <div class="field"><label for="pAct">今天的运动量</label><select id="pAct" data-prof="act">${opt(1,'基本不运动',p.act)}${opt(2,'轻量（30分钟内）',p.act)}${opt(3,'中等（30–60分钟）',p.act)}${opt(4,'大量（60分钟以上）',p.act)}</select></div>
      <div class="field"><label for="pSex">性别</label><select id="pSex" data-prof="sex">${opt('男','男',p.sex)}${opt('女','女',p.sex)}</select></div>

}
function dietAfter(){ if(S.planOn) genPlan(); }
function calcTargets(p){
  const bmr = 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex === '男' ? 5 : -161);
  const tdee = bmr * ({1:1.2, 2:1.375, 3:1.55, 4:1.725}[p.act] || 1.2);
  const adj = p.goal === 'gain' ? 300 : p.goal === 'lose' ? -400 : 0;
  const kcal = Math.max(tdee + adj, p.sex === '男' ? 1500 : 1200);
  const pk = p.goal === 'gain' ? 1.8 : p.goal === 'lose' ? 1.6 : 1.2;
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal:Math.round(kcal), prot:Math.round(pk * p.w), adj};
}
function pickMeal(meal, kT, pT, used){
  const pool = DISHES.filter(d => d.meals.includes(meal) && dietOK(d) && !used.has(d.id)
    && !winById(d.win).rest && !winById(d.win).sample);
  const mains = pool.filter(d => d.role === 'M'), sides = pool.filter(d => d.role === 'S');
  const sc = it => {
    const k = it.reduce((s, d) => s + d.kcal, 0), pr = it.reduce((s, d) => s + d.p, 0), pc = it.reduce((s, d) => s + d.price, 0);
    return Math.abs(k - kT) / kT * 100 + Math.max(0, pT - pr) / pT * 40 + (k > kT * 1.15 ? 20 : 0) + pc * .05;
  };
  let best = null, bs = 1e9;
  const tryIt = it => { const s = sc(it); if(s < bs){ bs = s; best = it; } };
  if(meal === 'B'){
    for(let i = 0; i < pool.length; i++){
      tryIt([pool[i]]);
      for(let j = i + 1; j < pool.length; j++){
        tryIt([pool[i], pool[j]]);
        for(let k = j + 1; k < pool.length; k++) tryIt([pool[i], pool[j], pool[k]]);
      }
    }
  }else{
    mains.forEach(m => {
      tryIt([m]);
      for(let i = 0; i < sides.length; i++){
        tryIt([m, sides[i]]);
        for(let j = i + 1; j < sides.length; j++) tryIt([m, sides[i], sides[j]]);
      }
    });
  }
  return best;
}
function genPlan(){
  const out = $('#planOut'); if(!out) return;
  const p = S.prof;
  if(!(p.age >= 14 && p.age <= 80 && p.h >= 130 && p.h <= 210 && p.w >= 30 && p.w <= 150)){
    out.innerHTML = '<p class="msg" style="color:var(--bad)">请检查年龄（14–80）、身高（130–210 厘米）、体重（30–150 公斤）是否填对。</p>'; return;
  }
  S.planOn = true;
  const t = calcTargets(p), used = new Set();
  const defs = [['B','早餐',.25], ['L','午餐',.40], ['D','晚餐',.35]];
  let tot = {k:0, p:0, c:0, f:0}, miss = false;
  const blocks = defs.map(([m, name, r]) => {
    const it = pickMeal(m, t.kcal * r, t.prot * r, used);
    if(!it){ miss = true; return `<div class="meal"><h3>${name}</h3><p class="note">筛选条件太严，这一餐没有合适的搭配。放宽一个条件再试。</p></div>`; }
    it.forEach(d => { if(d.role === 'M') used.add(d.id); });
    const k = it.reduce((s, d) => s + d.kcal, 0), pr = it.reduce((s, d) => s + d.p, 0), pc = it.reduce((s, d) => s + d.price, 0);
    tot.k += k; tot.p += pr; tot.c += it.reduce((s, d) => s + d.c, 0); tot.f += it.reduce((s, d) => s + d.f, 0);
    return `<div class="meal"><h3>${name} <span class="hint num">${k} 千卡 · 蛋白质 ${pr}g · ¥${pc}</span></h3>${it.map(d => dishRow(d, true)).join('')}</div>`;
  }).join('');
  const goalTxt = {gain:'增肌，在每天消耗的基础上多吃约 300 千卡', lose:'减脂，在每天消耗的基础上少吃约 400 千卡', maintain:'保持体重，吃得和消耗一样多'}[p.goal];
  const gap = Math.abs(tot.k - t.kcal) / t.kcal;
  out.innerHTML = `<div class="eta" style="margin-top:14px">今天的目标约 <b class="num">${t.kcal}</b> 千卡、蛋白质约 <b class="num">${t.prot}</b> 克。
    <div class="note">你每天基础消耗约 ${t.bmr} 千卡，加上今天的运动约 ${t.tdee} 千卡；目标是${goalTxt}。${t.kcal > t.tdee + t.adj ? '为了安全，热量不会低于 ' + (p.sex === '男' ? 1500 : 1200) + ' 千卡。' : ''}</div></div>
    ${blocks}
    ${miss ? '' : `<div class="macro" style="margin-top:6px"><div><b class="num">${tot.k}</b><span>总热量（千卡）</span></div><div><b class="num">${tot.p}</b><span>蛋白质（g）</span></div><div><b class="num">${Math.round(tot.c)}</b><span>碳水（g）</span></div><div><b class="num">${Math.round(tot.f)}</b><span>脂肪（g）</span></div></div>`}
    ${!miss && gap > .15 ? '<p class="note" style="margin-top:8px">按现在的筛选条件，能选的菜有限，这套搭配和目标有些差距，可以自己加一份主食或配菜。</p>' : ''}
    <p class="note" style="margin-top:8px">这是估算值，菜品热量来自示例数据，只作参考，不能代替医生或营养师的建议。</p>`;
}

function addRec(r, keepTab){
  const u = stu();

  if(r.d !== '' && r.d !== null && r.d !== undefined) DB.sold[r.d] = (DB.sold[r.d] || 0) + r.qty;

function sumRecs(rs){
  const s = {kcal:0, p:0, c:0, f:0, price:0, n:0};
  (rs || []).forEach(r => {
    s.kcal += r.kcal * r.qty; s.p += r.p * r.qty; s.c += r.c * r.qty;
    s.f += r.f * r.qty; s.price += r.price * r.qty; s.n += r.qty;
  });
  return s;
}

let PEND = false;
const isTyping = () => { const a = document.activeElement; return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName || ''); };
function afterSync(force){
  if(!force && isTyping()){ PEND = true; return; }   // 先记下来，等打完字再刷

/* ---- 内嵌的服务端源码：直接下载成文件 / 一键复制 ---- */
function dlText(name, text){
  let a = null;
  try{
    a = document.createElement('a');
    a.download = name; a.rel = 'noopener';
    try{
      const url = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
      a.href = url;
      document.body.appendChild(a); a.click();
      setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} a.remove(); }, 0);
    }catch(e1){
      a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);   // 老浏览器兜底
      document.body.appendChild(a); a.click(); a.remove();
    }
    return true;
  }catch(e){ if(a && a.parentNode) a.remove(); return false; }
}
function copyText(text, cb){
  const done = ok => cb && cb(ok);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
    }else done(fallbackCopy(text));
  }catch(e){ done(false); }
}
function fallbackCopy(text){
  try{
    const t = document.createElement('textarea');
    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy');
    t.remove(); return ok;
  }catch(e){ return false; }
}

  e.preventDefault();
  const f = e.target, fd = new FormData(f), g = k => String(fd.get(k) || '').trim();
  const now = new Date(), when = pad(now.getMonth() + 1) + '月' + pad(now.getDate()) + '日 ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  if(f.id === 'lostForm'){
    if(!g('name')){ $('#lostMsg').style.color = 'var(--bad)'; $('#lostMsg').textContent = '请先填写物品名称'; return; }
    S.lost.unshift({id:'u' + Date.now(), type:g('type'), name:g('name'), place:g('place'), when:'刚刚', note:g('note'), done:false});
    store('lost', S.lost); S.lostF = '全部'; renderContent();
    $('#lostMsg').textContent = '已发布到列表最上面';
  }else if(f.id === 'fbForm'){
    if(g('text').length < 5){ $('#fbMsg').style.color = 'var(--bad)'; $('#fbMsg').textContent = '请至少写 5 个字，说清楚情况'; return; }
    S.fb.unshift({id:'f' + Date.now(), cat:g('cat'), where:g('where'), text:g('text'), when:when, status:'已记录在本机（示例版，未发送给后勤）'});
    store('fb', S.fb); renderContent();
    $('#fbMsg').textContent = '已记录。示例版不会真正发送。';
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#overlay').hidden) closeOverlay(); });
$('#content').addEventListener('mousemove', showTip);
$('#content').addEventListener('mouseleave', () => { $('#tip').hidden = true; });
window.addEventListener('resize', () => applyView(false));

initState(false);
applyView(true);
setTimeout(() => store('gxGuide', 1), 3000);   // 首次打开时「怎么用」自动展开，看过一次之后就收起来
setInterval(tick, 6000);
setInterval(pollOtherTab, 3000);               // 别的标签页改了数据，最多 3 秒内这里就跟上
setInterval(apiPull, 20000);
apiPull();
</script>
